name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 看一眼 Xcode 版本
        run: xcodebuild -version

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project InvoiceManager.xcodeproj \
            -scheme InvoiceManager \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 打包成 IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP_PATH=$APP_PATH"
          ls -lh "$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r InvoiceManager-unsigned.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceManager-unsigned-ipa
          path: InvoiceManager-unsigned.ipa
          if-no-files-found: error
